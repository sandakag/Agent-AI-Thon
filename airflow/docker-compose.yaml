# Real Apache stack for the Predictive Pipeline Guardian demo.
#
# ISOLATED project: this stack runs under its OWN compose project name
# (`agent-aithon`) with its OWN host ports and volumes, completely separate from
# the itsm-self-heal-ai stack (project `airflow`). The two never share
# containers, networks or volumes. Do NOT remove the `name:` key below.
#
#   Airflow (LocalExecutor + Postgres) | Kafka 3.7 (KRaft) | Spark 3.5.1 | Kafka-UI
#   Prometheus + Grafana + Loki + Promtail + Tempo | live dashboard | Coinbase stream tap
#
# OpenTelemetry zero-code instrumentation:
#   Python services (dashboard, stream-generator) are wrapped with
#   `opentelemetry-instrument` so traces/metrics/logs flow automatically to the
#   OTel Collector without any source-code changes.  The collector fans them out
#   to Tempo (traces), Prometheus (metrics), and Loki (logs).
#
# Launch:  docker compose --env-file ../.env --profile full up -d --build
# UIs:     Airflow    http://localhost:18080  (admin/admin)
#          Dashboard  http://localhost:18089  (no login)
#          Kafka-UI   http://localhost:18085
#          Spark      http://localhost:18081
#          Grafana    http://localhost:13001  (no login — anonymous Admin)
#          Prometheus http://localhost:19090
#          Tempo      http://localhost:13200
---
name: agent-aithon
x-airflow-common: &airflow-common
  build:
    context: ..
    dockerfile: airflow/Dockerfile
  image: predictive-guardian-airflow:2.10.5
  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER:-airflow}:${POSTGRES_PASSWORD:-airflow}@postgres/${POSTGRES_DB:-airflow}
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    # Paused by default: the always-on guardian-loop is the single real-time engine
    # that drives the banner/predictions. The DAG stays available in the Airflow UI
    # as the "real Apache Airflow" showpiece — unpause + trigger it there on demand —
    # but it must NOT auto-run every 10 min and fight the loop over the banner state.
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "true"
    AIRFLOW__WEBSERVER__WORKERS: "2"
    AIRFLOW__WEBSERVER__WEB_SERVER_MASTER_TIMEOUT: "600"
    AIRFLOW__WEBSERVER__WEB_SERVER_WORKER_TIMEOUT: "600"
    PYTHONPATH: /opt/airflow/project
    ETL_PROJECT_ROOT: /opt/airflow/project
    # --- real data plane wiring ---
    KAFKA_BOOTSTRAP: kafka:29092
    KAFKA_TOPIC_RAW: trades-raw
    KAFKA_TOPIC_AGG: trades-aggregated
    SPARK_MASTER: local[*]
    JAVA_HOME: /usr/lib/jvm/default-java
    # --- AI brain selection (Copilot runs on the host; in-cluster falls back to
    #     the transparent heuristic, or set BRAIN=tardis for the prod brain) ---
    BRAIN: ${BRAIN:-auto}
    GUARDIAN_TICK_SECONDS: "600"
    # --- Copilot REST API brain (Claude Opus 4.8) for the detailed RCA + chat ---
    # The host's GitHub Copilot subscription token is mounted read-only (see the
    # volumes below) and COPILOT_TOKEN_STORE points the in-container brain at it,
    # so the dashboard chat and the loop's RCA reason with Opus. No PAT/API key.
    COPILOT_MODEL: ${COPILOT_MODEL:-claude-opus-4.8}
    COPILOT_MAX_TOKENS: ${COPILOT_MAX_TOKENS:-8000}
    COPILOT_TOKEN_STORE: ${COPILOT_TOKEN_STORE:-/opt/airflow/.copilot-standalone/token.json}
    # --- GitHub governance (real predicted-incident issue + gated PR) ---
    GITHUB_TOKEN: ${GITHUB_TOKEN:-}
    GITHUB_REPOSITORY: ${GITHUB_REPOSITORY:-}
    GOVERNANCE_REQUIRE_APPROVAL: ${GOVERNANCE_REQUIRE_APPROVAL:-false}
    GUARDIAN_MERGE_POLL_TICKS: ${GUARDIAN_MERGE_POLL_TICKS:-2}
    GUARDIAN_RECOVERY_TICKS: ${GUARDIAN_RECOVERY_TICKS:-4}
    # --- Grafana (in-network address) ---
    GRAFANA_URL: ${GRAFANA_INTERNAL_URL:-http://grafana:3000}
    GRAFANA_USER: ${GRAFANA_USER:-admin}
    GRAFANA_PASSWORD: ${GRAFANA_PASSWORD:-admin}
    # --- Grafana IRM / Incident (optional real incident on the predicted failure) ---
    GRAFANA_IRM_URL: ${GRAFANA_IRM_URL:-}
    GRAFANA_IRM_TOKEN: ${GRAFANA_IRM_TOKEN:-}
    # --- OpenTelemetry zero-code auto-instrumentation ---
    # Services wrapped with `opentelemetry-instrument` pick these up automatically.
    OTEL_ENABLED: ${OTEL_ENABLED:-true}
    OTEL_SERVICE_NAME: predictive-guardian
    OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4318}
    OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
    OTEL_TRACES_EXPORTER: otlp
    OTEL_METRICS_EXPORTER: otlp
    OTEL_LOGS_EXPORTER: otlp
    OTEL_PYTHON_LOGGING_AUTO_INSTRUMENTATION_ENABLED: "true"
    # Propagate trace context across HTTP calls (W3C TraceContext + Baggage)
    OTEL_PROPAGATORS: tracecontext,baggage
    OTEL_RESOURCE_ATTRIBUTES: deployment.environment=docker,service.namespace=predictive-guardian
  volumes:
    - ./dags:/opt/airflow/dags
    - ./logs:/opt/airflow/logs
    - ./plugins:/opt/airflow/plugins
    - ..:/opt/airflow/project
    # Host GitHub Copilot subscription token (read-only) so the in-container brain
    # can reach Claude Opus 4.8 via the Copilot API. Defaults dynamically to the
    # CURRENT user's standalone token dir (Windows %USERPROFILE%, else $HOME), so
    # it works on any machine. Override COPILOT_TOKEN_DIR in .env if token.json
    # lives elsewhere.
    - ${COPILOT_TOKEN_DIR:-${USERPROFILE:-${HOME:-/tmp}}/.copilot-standalone}:/opt/airflow/.copilot-standalone:ro
  depends_on:
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-airflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-airflow}
      POSTGRES_DB: ${POSTGRES_DB:-airflow}
    volumes:
      - postgres-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 5s
      retries: 5
    restart: always

  kafka:
    image: apache/kafka:3.7.0
    profiles: ["full"]
    ports:
      - "19092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:9093,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:19092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10

  kafka-init:
    image: apache/kafka:3.7.0
    profiles: ["full"]
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists --topic trades-raw --partitions 1 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists --topic trades-aggregated --partitions 1 --replication-factor 1
        echo "topics ready"

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    profiles: ["full"]
    ports:
      - "18085:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      DYNAMIC_CONFIG_ENABLED: "true"
    depends_on:
      kafka:
        condition: service_healthy

  spark-master:
    image: apache/spark:3.5.1
    profiles: ["full"]
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.master.Master"]
    environment:
      SPARK_NO_DAEMONIZE: "true"
    ports:
      - "18081:8080"
      - "17077:7077"

  spark-worker:
    image: apache/spark:3.5.1
    profiles: ["full"]
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.worker.Worker", "spark://spark-master:7077"]
    environment:
      SPARK_NO_DAEMONIZE: "true"
    depends_on:
      - spark-master

  # --- Always-on live tap: real Coinbase trades -> Kafka every cycle, so the
  #     pipeline is visibly alive in Kafka-UI and Grafana in real time. ---
  stream-generator:
    <<: *airflow-common
    profiles: ["full"]
    # Zero-code OTel instrumentation: wrapping with opentelemetry-instrument
    # auto-instruments urllib, kafka-python, logging — no source changes needed.
    entrypoint: ["/bin/bash", "-c"]
    command: ["opentelemetry-instrument python /opt/airflow/project/airflow/stream_generator.py"]
    environment:
      <<: *airflow-common-env
      STREAM_INTERVAL_SECONDS: "5"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    restart: always

  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate
        airflow users create --username admin --password admin \
          --firstname admin --lastname admin --role Admin --email admin@example.com || true
    restart: on-failure

  airflow-webserver:
    <<: *airflow-common
    # Clear any stale gunicorn PID file left behind when this container is
    # RESTARTED in place (host sleep/resume, Docker Desktop restart, OOM
    # auto-restart). Without this the webserver aborts on boot with
    # "Already running on PID … (or pid file is stale)" and the UI at :18080
    # never comes up -- even though postgres/scheduler/kafka all recover fine.
    command: ["bash", "-c", "rm -f /opt/airflow/airflow-webserver.pid; exec airflow webserver"]
    ports:
      - "18080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 300s
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    restart: always

  airflow-scheduler:
    <<: *airflow-common
    # Same stale-PID guard as the webserver: a restarted scheduler must never be
    # blocked by a leftover airflow-scheduler.pid from the previous process.
    command: ["bash", "-c", "rm -f /opt/airflow/airflow-scheduler.pid; exec airflow scheduler"]
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    restart: always

  dashboard:
    <<: *airflow-common
    # Zero-code OTel instrumentation: auto-instruments the stdlib HTTP server,
    # urllib calls (Coinbase fetches), and logging — no source changes needed.
    entrypoint: ["/bin/bash", "-c"]
    command: ["opentelemetry-instrument python -m dashboard"]
    environment:
      <<: *airflow-common-env
      DASHBOARD_PORT: "8089"
      OTEL_SERVICE_NAME: predictive-guardian-dashboard
    ports:
      - "18089:8089"
    depends_on:
      postgres:
        condition: service_healthy
    restart: always

  # --- ALWAYS-ON REAL-TIME PREDICTION ENGINE ---------------------------------
  # This is what makes the demo react live. It loops every few seconds:
  #   extract live trades -> apply any audience-injected fault (ramping) ->
  #   ETL -> collect signals (in memory, so trends build) -> predict the risk
  #   BEFORE the failure line -> grade GREEN/AMBER/RED -> banner + audit + stream.
  # An incident injected from the dashboard ramps from the instant you click it,
  # so you watch latency/null-rate/volume drift, risk cross AMBER then RED with a
  # real lead time, and a governed incident open — seconds before it would break.
  # Runs in the CORE profile (no Kafka needed: falls back to a direct Coinbase
  # fetch), so it is up whenever the dashboard is up.
  guardian-loop:
    <<: *airflow-common
    entrypoint: ["/bin/bash", "-c"]
    command: ["python -m guardian_loop"]
    working_dir: /opt/airflow/project
    environment:
      <<: *airflow-common-env
      GUARDIAN_LOOP_INTERVAL: ${GUARDIAN_LOOP_INTERVAL:-6}
      GUARDIAN_INJECT: "none"
    depends_on:
      postgres:
        condition: service_healthy
    restart: always

  # --- OpenTelemetry Collector: scrapes the guardian /metrics, accepts OTLP
  #     from the Python components, and exposes its own health/throughput so the
  #     OpenTelemetry service itself can be monitored in Grafana. ---
  # --- Grafana Tempo — distributed trace backend. ---
  # The OTel Collector forwards spans here via internal gRPC (tempo:4317).
  # Grafana queries Tempo on :3200; expose only the HTTP API to the host.
  tempo:
    image: grafana/tempo:2.6.0
    command: ["-config.file=/etc/tempo/tempo-config.yaml"]
    volumes:
      - ./monitoring/tempo/tempo-config.yaml:/etc/tempo/tempo-config.yaml:ro
      - tempo-data:/var/tempo
    ports:
      - "13200:3200"   # Tempo HTTP API / Grafana datasource
    restart: always

  # --- OpenTelemetry Collector: receives OTLP from auto-instrumented services,
  #     fans out to Tempo (traces), Prometheus (metrics), Loki (logs). ---
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.109.0
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./monitoring/otel/guardian-collector.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "14317:4317"   # OTLP gRPC  (apps -> collector)
      - "14318:4318"   # OTLP HTTP  (apps -> collector)
      - "18888:8888"   # collector internal telemetry (Prometheus scrapes this)
    depends_on:
      - dashboard
      - tempo
      - loki
      - prometheus
    restart: always

  prometheus:
    image: prom/prometheus:v2.54.1
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=15d"
      # Required for the OTel Collector prometheusremotewrite exporter to push
      # OTLP metrics into Prometheus.
      - "--web.enable-remote-write-receiver"
    ports:
      - "19090:9090"
    depends_on:
      - dashboard
    restart: always

  grafana:
    image: grafana/grafana:11.2.0
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SECURITY_DISABLE_BRUTE_FORCE_LOGIN_PROTECTION: "true"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Admin"
      GF_AUTH_ANONYMOUS_ORG_NAME: "Main Org."
      # Enable Tempo/tracing feature flags
      GF_FEATURE_TOGGLES_ENABLE: traceqlEditor,traceToMetrics
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "13001:3000"
    depends_on:
      - prometheus
      - loki
      - tempo
    restart: always

  loki:
    image: grafana/loki:3.1.1
    command: ["-config.file=/etc/loki/loki-config.yaml"]
    volumes:
      - ./monitoring/loki/loki-config.yaml:/etc/loki/loki-config.yaml:ro
      - loki-data:/loki
    ports:
      - "13100:3100"
    restart: always

  promtail:
    image: grafana/promtail:3.1.1
    command: ["-config.file=/etc/promtail/promtail-config.yaml"]
    volumes:
      - ./monitoring/promtail/promtail-config.yaml:/etc/promtail/promtail-config.yaml:ro
      - ../audit:/audit:ro
    depends_on:
      - loki
    restart: always

volumes:
  postgres-db:
  prometheus-data:
  grafana-data:
  loki-data:
  tempo-data:
