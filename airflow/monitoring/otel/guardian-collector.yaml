# OpenTelemetry Collector — the telemetry service for the Predictive Guardian.
#
# It does real work (so it can be meaningfully monitored):
#   1) prometheus receiver  -> actively SCRAPES the guardian /metrics endpoint
#   2) otlp receiver         -> accepts traces + metrics from the Python
#                               components (gRPC 4317 / HTTP 4318) when the OTLP
#                               SDK is present in the image
#   3) debug exporter        -> sink for the ingested guardian metrics
#
# The collector's OWN health/throughput is published on :8888 (internal
# telemetry, served via plain promhttp) and scraped by Prometheus — that feeds
# the "OpenTelemetry service performance" Grafana dashboard (otelcol_receiver_*,
# otelcol_exporter_*, otelcol_process_*). So even with zero app instrumentation
# the OTel board is alive, because the collector is continuously scraping the
# guardian endpoint and reporting its own throughput.

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318
  prometheus:
    config:
      scrape_configs:
        - job_name: guardian-scrape
          scrape_interval: 10s
          static_configs:
            - targets: ["dashboard:8089"]
              labels:
                collected_by: otel-collector

processors:
  batch:
    timeout: 5s

exporters:
  # NOTE: intentionally NO Prometheus *exporter* (:8889 pull server). In
  # otel-collector-contrib 0.109 that server's HTTP handler is wrapped in
  # otelhttp instrumentation that double-writes the response header and spams
  # "superfluous response.WriteHeader call" on every scrape. The collector still
  # does real work (the prometheus *receiver* scrapes the guardian /metrics
  # endpoint), and its own health/throughput is published spam-free on :8888.
  debug:
    verbosity: basic

service:
  telemetry:
    metrics:
      # `normal` exports every metric the OTel dashboard queries
      # (otelcol_receiver_*, otelcol_exporter_*, otelcol_process_*), published on
      # the built-in :8888 endpoint that Prometheus scrapes. The WriteHeader spam
      # was caused by the :8889 Prometheus *exporter* (now removed), not this
      # server, so the classic `address` form is both correct and spam-free.
      level: normal
      address: 0.0.0.0:8888
  pipelines:
    metrics:
      receivers: [otlp, prometheus]
      processors: [batch]
      exporters: [debug]
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug]
    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug]
