# OpenTelemetry Collector — the telemetry hub for the Predictive Guardian.
#
# Zero-code auto-instrumented Python services export OTLP telemetry here; the
# collector fans it out to the purpose-built backends:
#
#   Traces  -> Grafana Tempo   (gRPC otlp/tempo, tempo:4317)
#   Metrics -> Prometheus      (remote-write, prometheus:9090/api/v1/write)
#   Logs    -> Grafana Loki    (HTTP loki exporter, loki:3100)
#
# Receivers
#   otlp       : accepts traces + metrics + logs from Python services
#                (gRPC 4317 / HTTP 4318)
#   prometheus : actively scrapes the guardian /metrics endpoint so Prometheus
#                KPIs are also available in the OTel pipeline
#
# The collector's OWN health/throughput is published on :8888 (promhttp) and
# scraped by Prometheus, feeding the "OpenTelemetry service performance"
# Grafana dashboard (otelcol_receiver_*, otelcol_exporter_*, otelcol_process_*).

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318
  prometheus:
    config:
      scrape_configs:
        - job_name: guardian-scrape
          scrape_interval: 10s
          static_configs:
            - targets: ["dashboard:8089"]
              labels:
                collected_by: otel-collector

processors:
  batch:
    timeout: 5s
  # Ensure every span / metric / log record carries the canonical service name.
  resource:
    attributes:
      - action: upsert
        key: service.name
        from_attribute: service.name
      - action: insert
        key: service.namespace
        value: predictive-guardian

exporters:
  debug:
    verbosity: basic

  # Traces -> Grafana Tempo (internal gRPC, no TLS needed inside Docker network)
  otlp/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true

  # Metrics -> Prometheus via remote-write (requires --web.enable-remote-write-receiver
  # on the Prometheus process, set in the prometheus service command below).
  prometheusremotewrite:
    endpoint: http://prometheus:9090/api/v1/write
    tls:
      insecure: true
    resource_to_telemetry_conversion:
      enabled: true

  # Logs -> Grafana Loki
  loki:
    endpoint: http://loki:3100/loki/api/v1/push
    tls:
      insecure: true
    default_labels_enabled:
      exporter: false
      job: true
      instance: true
      level: true

service:
  telemetry:
    metrics:
      level: normal
      address: 0.0.0.0:8888
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch, resource]
      exporters: [debug, otlp/tempo]
    metrics:
      receivers: [otlp, prometheus]
      processors: [batch, resource]
      exporters: [debug, prometheusremotewrite]
    logs:
      receivers: [otlp]
      processors: [batch, resource]
      exporters: [debug, loki]
