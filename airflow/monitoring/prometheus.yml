# Prometheus scrape config for the Predictive Guardian stack.
# Prometheus pulls the guardian KPIs from the live dashboard /metrics endpoint
# (the same container that serves the HTML monitor on :8089).
global:
  scrape_interval: 10s
  evaluation_interval: 10s

scrape_configs:
  - job_name: predictive-guardian
    metrics_path: /metrics
    static_configs:
      - targets: ["dashboard:8089"]
        labels:
          service: predictive-guardian

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # OpenTelemetry Collector — its own health/throughput (otelcol_* series).
  # Powers the "OpenTelemetry service performance" Grafana dashboard.
  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8888"]
        labels:
          service: otel-collector
