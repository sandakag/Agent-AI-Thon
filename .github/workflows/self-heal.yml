name: Self-heal failed CI

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

# The workflow must use a fine-grained PAT, rather than github.token, to create
# a PR that triggers the normal PR CI workflow. See README for the exact scope.
permissions:
  contents: read
  actions: read

concurrency:
  group: self-heal-main
  cancel-in-progress: false

jobs:
  repair:
    # Do not recursively repair a failed repair branch, or run when CI is green.
    # Phase 1's CI fault lives entirely in pipeline/pricing.py (independent of
    # pipeline/etl.py, Phase 2's runtime-incident vulnerability), so this workflow
    # never needs to be paused for the Phase 2 demo -- healing it here can never
    # re-harden pipeline/etl.py.
    if: >-
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.head_branch == 'main' &&
      !startsWith(github.event.workflow_run.head_commit.message, 'self-heal:')
    # The ML known-fix analyzer (agent/playbook.py) repairs a recognized failure
    # with pure standard-library Python, so this job no longer needs the
    # presenter's Copilot login or a self-hosted runner. Running GitHub-hosted
    # means the demo never stalls waiting for a local runner to come online.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ secrets.SELF_HEAL_PAT }}
      COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
      COPILOT_ALLOW_ALL: "1"
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - name: Check GitHub access
        shell: pwsh
        run: |
          if (-not $env:GH_TOKEN) { throw 'Missing SELF_HEAL_PAT secret' }
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          token: ${{ secrets.SELF_HEAL_PAT }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Download failed-test logs
        shell: pwsh
        run: gh run view ${{ github.event.workflow_run.id }} --log-failed | Out-File -Encoding utf8 failed-ci.log
      - name: Ask the repair agent for a minimal patch
        run: python -m scripts.self_heal --failure-log failed-ci.log
      - name: Verify the proposed repair locally
        run: python -m unittest discover -s tests -v
      - name: Open repair pull request
        id: pr
        shell: pwsh
        run: |
          $branch = "self-heal/ci-${{ github.event.workflow_run.id }}"
          git config user.name 'self-heal-ci[bot]'
          git config user.email 'self-heal-ci[bot]@users.noreply.github.com'
          git checkout -b $branch
          git add -- ':!failed-ci.log'
          git commit -m "self-heal: repair failed CI run ${{ github.event.workflow_run.id }}"
          git push --set-upstream origin $branch
          $url = gh pr create --base main --head $branch --title "[self-heal] Copilot repair for CI run ${{ github.event.workflow_run.id }}" --body "GitHub Copilot authored the repair from failed CI logs: ${{ github.event.workflow_run.html_url }}`n`nThe safety guard accepted the patch and the full test suite passed before this PR was created.`n`n**A human must review and merge this PR — the self-heal workflow never merges automatically.**"
          "url=$url" | Out-File -Append -Encoding utf8 $env:GITHUB_OUTPUT
      - name: Wait for PR CI, then STOP for human merge
        shell: pwsh
        run: |
          $prNumber = gh pr view '${{ steps.pr.outputs.url }}' --json number --jq .number
          # PR checks can take a few seconds to register; poll before watching so
          # a race does not fail this hand-off step.
          for ($i = 0; $i -lt 12; $i++) {
            $checks = gh pr checks $prNumber 2>$null
            if ($LASTEXITCODE -eq 0 -or $checks) { break }
            Start-Sleep -Seconds 10
          }
          gh pr checks $prNumber --watch --fail-fast
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::warning::PR CI not confirmed green here; review PR #$prNumber directly."
          }
          # The repair PR exists and awaits review. This workflow deliberately
          # does NOT merge — a human reviewer merges the PR.
          Write-Host "Repair PR #$prNumber is open and awaiting human review/merge. This workflow will NOT merge it."
          exit 0
